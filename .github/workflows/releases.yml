name: Sidequest releases

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  checks: read
  pull-requests: read
  statuses: read

concurrency:
  group: sidequest-release-${{ github.sha }}
  cancel-in-progress: false

jobs:
  verification:
    name: Sidequest / verification
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, macOS, ARM64, sidequest, xcode-27, sidequest-mac-foreground]
    timeout-minutes: 45
    outputs:
      verification_directory: ${{ steps.verify.outputs.verification_directory }}
    steps:
      - name: Check out the exact merged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24, reviewed immutable revision
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          clean: true
      - name: Verify source, documentation, build, and tests
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          SIDEQUEST_EXPECTED_HEAD: ${{ github.sha }}
          SIDEQUEST_BASE_REF: main
        run: exec python3 scripts/ci-verify.py
      - name: Recover owned simulators after verification
        if: always()
        env:
          SIDEQUEST_EXPECTED_HEAD: ${{ github.sha }}
          SIDEQUEST_VERIFICATION_OUTCOME: ${{ steps.verify.outcome }}
        run: exec python3 scripts/ci_devices.py
  publish:
    name: Sidequest / publish preview
    needs: verification
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, macOS, ARM64, sidequest, xcode-27, sidequest-mac-foreground]
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
      checks: read
      pull-requests: read
      statuses: read
    steps:
      - name: Check out the verified event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24, reviewed immutable revision
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          clean: true
      - name: Publish or verify the existing private preview
        env:
          GH_TOKEN: ${{ github.token }}
          SIDEQUEST_VERIFICATION_DIRECTORY: ${{ needs.verification.outputs.verification_directory }}
        run: python3 scripts/publish-release.py
