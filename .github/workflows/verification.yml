name: Sidequest

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: sidequest-verification-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verification:
    name: Sidequest / verification
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64, sidequest, xcode-27, sidequest-mac-foreground]
    timeout-minutes: 45
    steps:
      - name: Check out the exact reviewed commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, reviewed immutable revision
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
          clean: true
      - name: Verify source, documentation, build, and tests
        env:
          SIDEQUEST_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          SIDEQUEST_BASE_REF: ${{ github.event.pull_request.base.ref || 'main' }}
        run: python3 scripts/ci-verify.py
