name: Sidequest

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: sidequest-verification-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verification:
    name: Sidequest / verification
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64, sidequest, xcode-27, sidequest-mac-foreground]
    timeout-minutes: 45
    steps:
      - name: Check out the exact reviewed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24, reviewed immutable revision
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
          clean: true
      - name: Verify source, documentation, build, and tests
        id: verify
        env:
          SIDEQUEST_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          SIDEQUEST_BASE_REF: ${{ github.event.pull_request.base.ref || 'main' }}
        run: exec python3 scripts/ci-verify.py
      - name: Recover owned simulators after verification
        if: always()
        env:
          SIDEQUEST_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          SIDEQUEST_VERIFICATION_OUTCOME: ${{ steps.verify.outcome }}
        run: exec python3 scripts/ci_devices.py
