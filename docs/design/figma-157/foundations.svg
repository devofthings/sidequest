<svg xmlns="http://www.w3.org/2000/svg" width="960" height="840"><rect x="0" y="0" width="960" height="840" rx="24" fill="#F5F3FF" stroke="none" stroke-width="1"/><text x="28" y="45" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#475569">PROPOSED / FOUNDATIONS / 05 OCT 2026</text><text x="28" y="91" font-family="Inter, sans-serif" font-size="30" font-weight="800" fill="#111827">Playful objects. Quiet reading. Clear outcomes.</text><text x="28" y="129" font-family="Inter, sans-serif" font-size="18" font-weight="400" fill="#475569">Refinement of the delivered baseline — visual proposals, existing behavior.</text><rect x="28" y="162" width="145" height="98" rx="20" fill="#C5F36B" stroke="none" stroke-width="1"/><text x="44" y="205" font-family="Inter, sans-serif" font-size="22" font-weight="700" fill="#111827">Lime</text><text x="44" y="237" font-family="Inter, sans-serif" font-size="16" font-weight="400" fill="#111827">#C5F36B</text><rect x="193" y="162" width="145" height="98" rx="20" fill="#C4B5FD" stroke="none" stroke-width="1"/><text x="209" y="205" font-family="Inter, sans-serif" font-size="22" font-weight="700" fill="#111827">Lavender</text><text x="209" y="237" font-family="Inter, sans-serif" font-size="16" font-weight="400" fill="#111827">#C4B5FD</text><rect x="358" y="162" width="145" height="98" rx="20" fill="#FDA4AF" stroke="none" stroke-width="1"/><text x="374" y="205" font-family="Inter, sans-serif" font-size="22" font-weight="700" fill="#111827">Coral</text><text x="374" y="237" font-family="Inter, sans-serif" font-size="16" font-weight="400" fill="#111827">#FDA4AF</text><rect x="523" y="162" width="145" height="98" rx="20" fill="#67E8F9" stroke="none" stroke-width="1"/><text x="539" y="205" font-family="Inter, sans-serif" font-size="22" font-weight="700" fill="#111827">Cyan</text><text x="539" y="237" font-family="Inter, sans-serif" font-size="16" font-weight="400" fill="#111827">#67E8F9</text><text x="28" y="308" font-family="Inter, sans-serif" font-size="17" font-weight="700" fill="#475569">TYPOGRAPHY / SPACE</text><text x="28" y="353" font-family="Inter, sans-serif" font-size="26" font-weight="800" fill="#111827">Bold, rounded game headings</text><text x="28" y="389" font-family="Inter, sans-serif" font-size="20" font-weight="400" fill="#111827">Serif news headline; readable system body.</text><text x="28" y="425" font-family="Inter, sans-serif" font-size="18" font-weight="400" fill="#475569">8 pt rhythm • 24 pt insets • opaque surfaces</text><rect x="700" y="163" width="232" height="280" rx="24" fill="#101427" stroke="none" stroke-width="1"/><text x="720" y="198" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#CBD5E1">DARK APPEARANCE</text><text x="720" y="245" font-family="Inter, sans-serif" font-size="30" font-weight="800" fill="#F8FAFC">Memory</text><text x="720" y="277" font-family="Inter, sans-serif" font-size="18" font-weight="400" fill="#CBD5E1">Find six pairs.</text><rect x="720" y="302" width="58" height="66" rx="12" fill="#FDA4AF" stroke="none" stroke-width="1"/><text x="740" y="345" font-family="Inter, sans-serif" font-size="26" font-weight="700" fill="#111827">+</text><rect x="787" y="302" width="58" height="66" rx="12" fill="#C5F36B" stroke="none" stroke-width="1"/><text x="807" y="345" font-family="Inter, sans-serif" font-size="26" font-weight="700" fill="#111827">★</text><rect x="854" y="302" width="58" height="66" rx="12" fill="#FDA4AF" stroke="none" stroke-width="1"/><text x="874" y="345" font-family="Inter, sans-serif" font-size="26" font-weight="700" fill="#111827">+</text><rect x="720" y="385" width="192" height="48" rx="12" fill="#C5F36B" stroke="none" stroke-width="1"/><text x="736" y="412" font-family="Inter, sans-serif" font-size="18" font-weight="700" fill="#111827">Tap to play</text><rect x="28" y="471" width="904" height="146" rx="20" fill="#FFFFFF" stroke="none" stroke-width="1"/><text x="48" y="506" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#475569">MOTION STORYBOARD / NOT A RUNNING PROTOTYPE</text><text x="48" y="549" font-family="Inter, sans-serif" font-size="22" font-weight="700" fill="#111827">Touch</text><text x="48" y="580" font-family="Inter, sans-serif" font-size="17" font-weight="400" fill="#475569">Fill + outline</text><text x="266" y="549" font-family="Inter, sans-serif" font-size="22" font-weight="700" fill="#111827">Respond</text><text x="266" y="580" font-family="Inter, sans-serif" font-size="17" font-weight="400" fill="#475569">160 ms emphasis</text><text x="484" y="549" font-family="Inter, sans-serif" font-size="22" font-weight="700" fill="#111827">Settle</text><text x="484" y="580" font-family="Inter, sans-serif" font-size="17" font-weight="400" fill="#475569">Readable result</text><text x="702" y="549" font-family="Inter, sans-serif" font-size="22" font-weight="700" fill="#111827">Reduce Motion</text><text x="702" y="580" font-family="Inter, sans-serif" font-size="17" font-weight="400" fill="#475569">Immediate state</text><text x="28" y="661" font-family="Inter, sans-serif" font-size="17" font-weight="700" fill="#475569">STABLE &amp; ACCESSIBLE</text><text x="28" y="701" font-family="Inter, sans-serif" font-size="18" font-weight="400" fill="#111827">375×579 pt pocket viewport: preserve the board; inner scrolling owns overflow.</text><text x="28" y="736" font-family="Inter, sans-serif" font-size="17" font-weight="400" fill="#475569">Large text: grow text regions, use two Memory columns and Chess coordinate controls.</text><text x="28" y="769" font-family="Inter, sans-serif" font-size="17" font-weight="400" fill="#475569">44×44 pt minimum controls. Color + symbols + text; increased-contrast outlines.</text><text x="28" y="806" font-family="Inter, sans-serif" font-size="17" font-weight="600" fill="#111827">Skip cancels transient feedback. Completed revisits do not replay celebrations.</text></svg>