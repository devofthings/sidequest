<text x="52" y="678" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="800" fill="#25243A">IMPLEMENTATION GUARDRAILS</text>
<text x="52" y="708" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="500" fill="#25243A">Keep recognizable piece types, spoken names and color-independent pair identity.</text>
<text x="52" y="734" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="500" fill="#25243A">Use 44 pt actions; scale decorative art inside fixed game bounds. Never reveal hidden answers.</text>
<text x="52" y="760" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="500" fill="#25243A">Selected: bold outline. Matched: check + label. Disabled: readable, no action. Motion stays local.</text>
<text x="32" y="825" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="500" fill="#25243A">Static design proposal · native accessibility, contrast and touch behavior require app verification.</text>
